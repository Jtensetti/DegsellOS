name: Bygg DegsellOS-labbet

# Den reproducerbara analysmiljön (R, Python, RStudio, Pandoc).
on:
  push:
    branches: ["**"]
    paths: ["labb/**", ".github/workflows/labb.yml"]
  pull_request:
    paths: ["labb/**"]
  workflow_dispatch:

permissions:
  contents: read

# Labbets namn i registret. DegsellOS-installationer från tiden som ForskarOS hämtar
# labbet under LEGACY_IMAGE_NAME, som får samma avbildning vid varje publicering.
env:
  IMAGE_NAME: ghcr.io/jtensetti/degsellos-labb
  LEGACY_IMAGE_NAME: ghcr.io/jtensetti/researchos-labb

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Installera podman vid behov
        run: command -v podman || (sudo apt-get update && sudo apt-get install -y podman)
      - name: Bygg
        run: podman build -f labb/Containerfile -t localhost/degsellos-labb:${{ matrix.arch }} .
      - name: Röktest
        run: podman run --rm -v "$PWD/labb:/test:ro" localhost/degsellos-labb:${{ matrix.arch }} bash /test/rok.sh
      - name: Publicera arkitekturspecifik tagg
        if: (github.ref_name == 'main' || github.ref_name == github.event.repository.default_branch) && github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="$IMAGE_NAME"
          echo "$TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman push localhost/degsellos-labb:${{ matrix.arch }} "docker://$IMAGE:latest-${{ matrix.arch }}"

  publish:
    if: (github.ref_name == 'main' || github.ref_name == github.event.repository.default_branch) && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
      - name: Flerarkitekturs-manifest med version och datum
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="$IMAGE_NAME"
          VERSION=$(cat VERSION)
          echo "$TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman manifest create labb "docker://$IMAGE:latest-amd64" "docker://$IMAGE:latest-arm64"
          podman manifest push --all --digestfile /tmp/digest labb "docker://$IMAGE:latest"
          podman manifest push --all labb "docker://$IMAGE:$(date -u +%Y%m%d)"
          podman manifest push --all labb "docker://$LEGACY_IMAGE_NAME:latest"
          if [[ "$VERSION" != *-dev ]]; then podman manifest push --all labb "docker://$IMAGE:$VERSION"; fi
          echo "IMAGE_REF=$IMAGE@$(cat /tmp/digest)" >> "$GITHUB_ENV"
      - name: Signera
        env:
          COSIGN_YES: "true"
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign "$IMAGE_REF"
          cosign sign "$LEGACY_IMAGE_NAME@${IMAGE_REF#*@}"
