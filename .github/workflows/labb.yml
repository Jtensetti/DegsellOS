name: Bygg ForskarOS-labbet

# Den reproducerbara analysmiljön (R, Python, RStudio, Pandoc).
on:
  push:
    branches: ["**"]
    paths: ["labb/**", ".github/workflows/labb.yml"]
  pull_request:
    paths: ["labb/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Installera podman vid behov
        run: command -v podman || (sudo apt-get update && sudo apt-get install -y podman)
      - name: Bygg
        run: podman build -f labb/Containerfile -t localhost/forskaros-labb:${{ matrix.arch }} .
      - name: Röktest
        run: podman run --rm -v "$PWD/labb:/test:ro" localhost/forskaros-labb:${{ matrix.arch }} bash /test/rok.sh
      - name: Publicera arkitekturspecifik tagg
        if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-labb"
          echo "$TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman push localhost/forskaros-labb:${{ matrix.arch }} "docker://$IMAGE:latest-${{ matrix.arch }}"

  publish:
    if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
      - name: Flerarkitekturs-manifest med version och datum
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-labb"
          VERSION=$(cat VERSION)
          echo "$TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman manifest create labb "docker://$IMAGE:latest-amd64" "docker://$IMAGE:latest-arm64"
          podman manifest push --all --digestfile /tmp/digest labb "docker://$IMAGE:latest"
          for tag in "$VERSION" "$(date -u +%Y%m%d)"; do podman manifest push --all labb "docker://$IMAGE:$tag"; done
          echo "IMAGE_REF=$IMAGE@$(cat /tmp/digest)" >> "$GITHUB_ENV"
      - name: Signera
        env:
          COSIGN_YES: "true"
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign "$IMAGE_REF"
