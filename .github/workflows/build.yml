name: Bygg ForskarOS-avbildning

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Veckobyggnad med basavbildningens uppdateringar.
    - cron: "17 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_IMAGE: ghcr.io/ublue-os/bluefin:lts
  # Fasta namn på avbildningarna. Repot heter DegsellOS sedan november 2026, men installerade
  # datorer (bootc följer latest), installationsanvisningarna och labbet i OS:et hämtar härifrån.
  # Byt bara namn tillsammans med en flyttväg för installerade datorer.
  IMAGE_NAME: ghcr.io/jtensetti/researchos

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installera Pandoc, bubblewrap och RO-Crate-validerare för projektproven
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc bubblewrap
          # Ubuntu 24.04 begränsar användarnamnrymder för oprivilegierade program med AppArmor.
          # ForskarOS-avbildningen (CentOS Stream 10) har ingen sådan begränsning.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          python3 -m venv "$RUNNER_TEMP/rocrate" && "$RUNNER_TEMP/rocrate/bin/pip" install -q roc-validator==0.14.0
          echo "FORSKAROS_ROCRATE_VALIDATOR=$RUNNER_TEMP/rocrate/bin/rocrate-validator" >> "$GITHUB_ENV"
      - name: Installera GTK 4, libadwaita och Xvfb för appens självtest
        run: sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 xvfb
      - name: Kontroller och acceptanstest (sandlåda, RO-Crate och appen krävs)
        env:
          FORSKAROS_KRAV_SANDLADA: "1"
          FORSKAROS_KRAV_ROCRATE: "1"
          FORSKAROS_KRAV_APP: "1"
          FORSKAROS_SKARMDUMPAR: ${{ runner.temp }}/skarmdumpar
        run: bash scripts/check.sh
      - name: Spara appens skärmdumpar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-skarmdumpar
          path: ${{ runner.temp }}/skarmdumpar
          if-no-files-found: ignore
      - name: Kontrollera att alla verktyg finns för amd64 och arm64
        run: bash tests/verify-apps.sh

  build:
    if: "!startsWith(github.event.head_commit.message, '[release-iso] ')"
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Frigör diskutrymme
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Installera podman vid behov
        run: command -v podman || (sudo apt-get update && sudo apt-get install -y podman)

      - name: Bygg
        run: |
          sudo podman build --pull=newer \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            -t localhost/forskaros:${{ matrix.arch }} .

      - name: Publicera arkitekturspecifik tagg
        if: github.ref_name == 'main' && github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="$IMAGE_NAME"
          echo "$TOKEN" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman push localhost/forskaros:${{ matrix.arch }} "docker://$IMAGE:latest-${{ matrix.arch }}"
          sudo podman push localhost/forskaros:${{ matrix.arch }} "docker://$IMAGE:build-$GITHUB_RUN_ID-${{ matrix.arch }}"

  publish:
    if: github.ref_name == 'main' && github.event_name != 'pull_request'
    needs: build
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
      version: ${{ steps.manifest.outputs.version }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3

      - name: Skapa och publicera flerarkitekturs-manifest
        id: manifest
        env:
          RELEASE_MEDIA: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, '[release-media] ') }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="$IMAGE_NAME"
          echo "$TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman manifest create forskaros-manifest \
            "docker://$IMAGE:build-$GITHUB_RUN_ID-amd64" "docker://$IMAGE:build-$GITHUB_RUN_ID-arm64"
          podman manifest push --all --digestfile /tmp/digest \
            forskaros-manifest "docker://$IMAGE:latest"
          podman manifest push --all \
            forskaros-manifest "docker://$IMAGE:$(date -u +%Y%m%d)"
          # En vanlig push eller schemalagd ombyggnad får inte flytta en släppt version.
          VERSION=$(cat VERSION)
          if [[ "$RELEASE_MEDIA" == true ]]; then
            [[ "$VERSION" =~ ^[0-9]{4}\.[1-4](-[a-z0-9]+)?$ && "$VERSION" != *-dev ]]
            podman manifest push --all forskaros-manifest "docker://$IMAGE:$VERSION"
          fi
          echo "digest=$(cat /tmp/digest)" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "IMAGE_REF=$IMAGE@$(cat /tmp/digest)" >> "$GITHUB_ENV"

      - name: Signera (sigstore, nyckellöst)
        env:
          COSIGN_YES: "true"
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign "$IMAGE_REF"

  release-media:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, '[release-media] ')
    needs: publish
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/release-vm.yml
    with:
      version: ${{ needs.publish.outputs.version }}
      digest: ${{ needs.publish.outputs.digest }}
    secrets:
      IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}

  published-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, '[release-iso] ')
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.image.outputs.version }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        name: Hämta den redan publicerade versionens manifest
        run: |
          VERSION=$(cat VERSION)
          [[ "$VERSION" =~ ^[0-9]{4}\.[1-4](-[a-z0-9]+)?$ && "$VERSION" != *-dev ]]
          DIGEST=$(skopeo inspect --format '{{.Digest}}' "docker://$IMAGE_NAME:$VERSION")
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

  release-iso:
    needs: published-image
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/release-vm.yml
    with:
      version: ${{ needs.published-image.outputs.version }}
      digest: ${{ needs.published-image.outputs.digest }}
      endast: iso
    secrets:
      IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
