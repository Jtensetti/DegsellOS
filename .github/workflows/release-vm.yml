name: Släpp färdig VM

# Bygger färdiga virtuella diskar och en installations-ISO från den publicerade
# avbildningen och laddar upp dem till Internet Archive. Där får de en
# direktlänk och en torrent som Archive.org själv delar ut.
#
# Kräver hemligheterna IA_ACCESS_KEY och IA_SECRET_KEY
# (https://archive.org/account/s3.php).
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, t.ex. 2027.1 eller 2027.1-beta1
        required: true
      tag:
        description: Avbildningstagg i ghcr.io att bygga från
        default: latest
      endast:
        description: Bygg och ladda upp bara en sort (för att köra om en som misslyckades)
        type: choice
        options: [alla, vm, iso]
        default: alla

permissions:
  contents: read
  packages: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          ALLA='[
            {"arch":"arm64","runner":"ubuntu-24.04-arm","type":"qcow2","config":"disk.toml","kind":"vm","what":"Virtuell disk för Apple Silicon-Mac (UTM)"},
            {"arch":"amd64","runner":"ubuntu-24.04","type":"qcow2","config":"disk.toml","kind":"vm","what":"Virtuell disk för PC (QEMU, virt-manager, UTM)"},
            {"arch":"amd64","runner":"ubuntu-24.04","type":"anaconda-iso","config":"iso.toml","kind":"iso","what":"Installations-ISO för PC och Intel-Mac"}]'
          echo "matrix=$(jq -c --arg e '${{ inputs.endast }}' '{include: [.[] | select($e == "alla" or .kind == $e)]}' <<<"$ALLA")" >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ inputs.version }}
      ITEM: forskaros-${{ inputs.version }}-${{ matrix.arch }}-${{ matrix.kind }}
    steps:
      - uses: actions/checkout@v4

      - name: Kontrollera versionsnummer
        run: |
          [[ "$VERSION" =~ ^[0-9]{4}\.[1-4](-[a-z0-9]+)?$ ]] || { echo "Ogiltig version: $VERSION (t.ex. 2027.1 eller 2027.1-beta1)"; exit 1; }

      - name: Frigör diskutrymme
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Installera verktyg
        run: |
          sudo apt-get update
          sudo apt-get install -y podman qemu-utils

      - name: Hämta avbildningen
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${{ inputs.tag }}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "$TOKEN" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull --arch ${{ matrix.arch }} "$IMAGE"

      - name: Bygg disk med bootc-image-builder
        run: |
          mkdir -p output
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v "$PWD/disk_config/${{ matrix.config }}:/config.toml:ro" \
            -v "$PWD/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type ${{ matrix.type }} --use-librepo=True \
            "$IMAGE"
          sudo chown -R "$USER" output
          find output -type f -exec ls -lh {} \;

      - name: Förbered filer
        run: |
          mkdir -p dist
          BASE="ForskarOS-$VERSION-${{ matrix.arch }}"
          if [[ "${{ matrix.type }}" == qcow2 ]]; then
            # Komprimerad qcow2: mindre nedladdning, kan importeras direkt i UTM.
            qemu-img convert -p -c -O qcow2 output/qcow2/disk.qcow2 "dist/$BASE.qcow2"
            FILE="$BASE.qcow2"
          else
            mv output/bootiso/install.iso "dist/$BASE.iso"
            FILE="$BASE.iso"
          fi
          rm -rf output
          # Apple Silicon: färdigt UTM-paket om mallen finns (vm/utm/config.plist).
          if [[ "${{ matrix.arch }}" == arm64 && -f vm/utm/config.plist ]]; then
            python3 scripts/paketera_utm.py vm/utm/config.plist "dist/$FILE" "dist/$BASE.utm.zip"
            rm "dist/$FILE"
            FILE="$BASE.utm.zip"
          fi
          (cd dist && sha256sum "$FILE" > "$FILE.sha256")
          echo "FILE=$FILE" >> "$GITHUB_ENV"
          ls -lh dist

      - name: Ladda upp till Internet Archive
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          WHAT: ${{ matrix.what }}
        run: |
          [[ -n "$IA_ACCESS_KEY" && -n "$IA_SECRET_KEY" ]] || { echo "IA-hemligheterna saknas"; exit 1; }
          DESC="ForskarOS: Linuxdistribution för forskningsarbete, byggd på Bluefin LTS. Inloggning i diskavbildningen: forskare / forskare (lösenordet måste bytas). Källkod: https://github.com/Jtensetti/researchOS"
          if [[ "$VERSION" == *-* ]]; then DESC="Förhandsversion, inte testad på hårdvara. $DESC"; fi
          uri() { printf 'uri(%s)' "$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$1")"; }
          # Internet Archives S3-gränssnitt. Stora filer kan ta lång tid att
          # bekräfta efter uppladdningen, därav lång tidsgräns och omförsök.
          put() {
            curl --fail-with-body -sS --retry 5 --retry-delay 60 --retry-all-errors --max-time 10800 \
              -H "authorization: LOW $IA_ACCESS_KEY:$IA_SECRET_KEY" \
              -H "x-amz-auto-make-bucket:1" \
              -H "x-archive-size-hint:$(stat -c%s "$1")" \
              "${@:2}" -T "$1" "https://s3.us.archive.org/$ITEM/$(basename "$1")"
          }
          # Kontrollsumman först: den skapar objektet med metadata.
          put "dist/$FILE.sha256" \
            -H "x-archive-meta-mediatype:software" \
            -H "x-archive-meta-title:$(uri "ForskarOS $VERSION – $WHAT")" \
            -H "x-archive-meta-description:$(uri "$DESC")" \
            -H "x-archive-meta-creator:ForskarOS" \
            -H "x-archive-meta01-subject:linux" -H "x-archive-meta02-subject:research" -H "x-archive-meta03-subject:bootc" \
            -H "x-archive-meta-licenseurl:https://opensource.org/licenses/MIT" \
            -H "x-archive-meta-source:https://github.com/Jtensetti/researchOS"
          put "dist/$FILE"

      - name: Kontrollera att filen finns på Internet Archive
        run: |
          SIZE=$(stat -c%s "dist/$FILE")
          for i in $(seq 1 60); do
            got=$(curl -fsS "https://archive.org/metadata/$ITEM" | jq -r --arg f "$FILE" '.files[]? | select(.name == $f) | .size' || true)
            if [[ "$got" == "$SIZE" ]]; then echo "OK: $FILE finns ($SIZE byte)"; exit 0; fi
            echo "Väntar på $FILE (har: ${got:-inget}, väntat: $SIZE)"; sleep 60
          done
          echo "Filen syns inte på Internet Archive efter en timme"; exit 1

      - name: Sammanfattning
        run: |
          {
            echo "### ${{ matrix.what }}"
            echo "- Sida: https://archive.org/details/$ITEM"
            echo "- Direktlänk: https://archive.org/download/$ITEM/$FILE"
            echo "- Torrent: https://archive.org/download/$ITEM/${ITEM}_archive.torrent"
            echo "- SHA-256: \`$(cut -d' ' -f1 dist/$FILE.sha256)\`"
          } >> "$GITHUB_STEP_SUMMARY"
