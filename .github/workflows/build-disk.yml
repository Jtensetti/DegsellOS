name: Bygg installationsmedia

# Startas manuellt (Actions → Bygg installationsmedia → Run workflow)
# när en avbildning finns publicerad i ghcr.io.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Avbildningstagg att bygga från
        default: latest

permissions:
  contents: read
  packages: read

jobs:
  disk:
    strategy:
      fail-fast: false
      matrix:
        include:
          # PC och Intel-Mac: installations-ISO
          - { arch: amd64, runner: ubuntu-24.04, type: anaconda-iso, config: iso.toml }
          # Apple Silicon (t.ex. MacBook Neo) i UTM: färdig virtuell disk
          - { arch: arm64, runner: ubuntu-24.04-arm, type: qcow2, config: disk.toml }
          # Virtuell disk även för PC, för test i QEMU/virt-manager
          - { arch: amd64, runner: ubuntu-24.04, type: qcow2, config: disk.toml }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Frigör diskutrymme
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Installera podman vid behov
        run: command -v podman || (sudo apt-get update && sudo apt-get install -y podman)

      - name: Hämta avbildningen
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${{ inputs.tag }}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "$TOKEN" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull --arch ${{ matrix.arch }} "$IMAGE"

      - name: Kör bootc-image-builder
        run: |
          mkdir -p output
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v "$PWD/disk_config/${{ matrix.config }}:/config.toml:ro" \
            -v "$PWD/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type ${{ matrix.type }} --use-librepo=True \
            "$IMAGE"
          sudo chown -R "$USER" output
          find output -type f -exec ls -lh {} \;

      - name: Komprimera och paketera för UTM
        if: matrix.type == 'qcow2'
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-utils
          qemu-img convert -p -c -O qcow2 output/qcow2/disk.qcow2 "output/ForskarOS-${{ matrix.arch }}.qcow2"
          rm -rf output/qcow2
          if [[ "${{ matrix.arch }}" == arm64 && -f vm/utm/config.plist ]]; then
            python3 scripts/paketera_utm.py vm/utm/config.plist \
              "output/ForskarOS-${{ matrix.arch }}.qcow2" "output/ForskarOS-${{ matrix.arch }}.utm.zip"
            rm "output/ForskarOS-${{ matrix.arch }}.qcow2"
          fi
          ls -lh output

      - uses: actions/upload-artifact@v4
        with:
          name: forskaros-${{ matrix.arch }}-${{ matrix.type }}
          path: output/
          retention-days: 14
