# Utan en egen Kickstart genererar bootc-image-builder clearpart --all.
# Låt Anaconda fråga efter måldisk och invänta användarens bekräftelse.
[customizations.installer.kickstart]
contents = """
graphical
rootpw --lock
firstboot --enable
"""

[customizations.installer.modules]
enable = ["org.fedoraproject.Anaconda.Modules.Localization"]
