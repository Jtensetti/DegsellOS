# Utan en egen Kickstart genererar bootc-image-builder clearpart --all.
# Låt Anaconda fråga efter måldisk och invänta användarens bekräftelse.
[customizations.installer.kickstart]
contents = """
graphical
rootpw --lock
firstboot --enable
"""

[customizations.installer.modules]
# Språkvyn använder tidszonstjänsten när användaren väljer sitt språk.
enable = [
    "org.fedoraproject.Anaconda.Modules.Localization",
    "org.fedoraproject.Anaconda.Modules.Timezone",
]
