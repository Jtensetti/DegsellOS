# bootc-image-builder: diskavbildning (qcow2/raw) för virtuella maskiner,
# t.ex. UTM på en Mac.
#
# Kontot forskare / forskare.
# Lösenordet MÅSTE bytas vid första inloggningen (forskaros-forskare.service
# markerar det som utgånget vid första start). ISO-installationer har inget
# förinställt konto.
[[customizations.user]]
name = "forskare"
password = "forskare"
groups = ["wheel"]

[[customizations.filesystem]]
mountpoint = "/"
minsize = "40 GiB"
