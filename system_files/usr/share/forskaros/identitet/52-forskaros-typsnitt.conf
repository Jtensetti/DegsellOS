<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Genererad av scripts/identitet.py från katalog/design.json. Ändra inte för hand.
     Nummer 52: efter användarens egna inställningar (50), före systemets standardval (56 och uppåt). -->
<fontconfig>
  <description>ForskarOS: typsnitt för gränssnitt, läsning och kod</description>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Adwaita Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>system-ui</family>
    <prefer><family>Adwaita Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer><family>Noto Serif</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>JetBrains Mono</family></prefer>
  </alias>
</fontconfig>
